{{ with .Page.Params.leadForm }}
    {{ with .heading }}
        <h2 id="lead-form-heading">{{ . }}</h2>
    {{ end }}

    {{ with .intro }}
        <p>{{ . }}</p>
    {{ end }}

    <form id="lead-form" class="lead-form">
		<!-- honeypot -->
        <input
            type="hidden"
            name="site-key"
            value="{{ site.Params.leadForm.siteKey }}"
        >
		<!-- page url of form submit -->
		<input
			type="hidden"
			name="page_url"
			value="{{ .page.RelPermalink }}"
		>
		<!-- site-key for backend storage -->
		<input
			type="hidden"
			name="site_key"
			value="{{ site.Params.leadForm.siteKey }}"
		>

        <div class="form-field">
            <label class="visually-hidden" for="lead-name">Name</label>
            <input
                type="text"
                id="lead-name"
                name="name"
                placeholder="Name"
                autocomplete="name"
            >
        </div>

        <div class="form-field">
            <label class="visually-hidden" for="lead-phone">Phone</label>
            <input
                type="tel"
                id="lead-phone"
                name="phone"
                placeholder="Phone"
                autocomplete="tel"
            >
        </div>

        <div class="form-field">
            <label class="visually-hidden" for="lead-email">Email address</label>
            <input
                type="email"
                id="lead-email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-field">
            <label class="visually-hidden" for="lead-description">Give a brief description.</label>
            <textarea
                id="lead-description"
                name="description"
                rows="4"
                placeholder="Give a brief description."
            ></textarea>
        </div>

        <button type="submit" class="form-submit">
            {{ .submitText | default "Submit Request" }}
        </button>

    </form>

	<p class="form-message" role="status" aria-live="polite" hidden></p>

    {{ with .privacyNote }}
        <p class="lead-form_privacy">{{ . }}</p>
    {{ end }}
{{ end }}
