<header class="site-header">
	<div class="container">
		<div class="business-header">
			<!-- Left: clickable business phone number -->
			<a class="header-phone" href="tel:{{ replaceRE `[^0-9+]` "" site.Params.phone }}">
				{{ site.Params.phone }}
			</a>
			

			<!-- Center: Business logo and name-->
			<div class="site-header__brand">
				<!-- Logo Right-side of brand-->
				<img 
				 src="{{ site.Params.brand.logo }}"
				 alt="{{ site.Params.brand.logo_alt }}"
				 >
				 <!-- Business name left-side of brand -->
				<span class="bussiness-name">
					{{ site.Params.businessName }}
				</span>
			</div>

			<!-- Right:  Header email -->
			<!-- clickable email link to attempt to open mail app -->
			{{ with site.Params.email }}
				<a class="header-email" href="mailto:{{ . }}">{{ . }}</a>
			{{ end }}
		</div>
	</div>
</header>
